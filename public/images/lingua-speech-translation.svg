<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <radialGradient id="glowBg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="55%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </radialGradient>
    <linearGradient id="panelL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="panelR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="waveL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="waveR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glowBg)"/>

  <!-- faint floating language chips -->
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f0f9ff" opacity="0.16">
    <g transform="translate(120,140)"><rect width="56" height="30" rx="8" fill="#ffffff" opacity="0.06"/><text x="28" y="21" text-anchor="middle">FR</text></g>
    <g transform="translate(1010,110)"><rect width="56" height="30" rx="8" fill="#ffffff" opacity="0.06"/><text x="28" y="21" text-anchor="middle">ES</text></g>
    <g transform="translate(90,700)"><rect width="56" height="30" rx="8" fill="#ffffff" opacity="0.06"/><text x="28" y="21" text-anchor="middle">AR</text></g>
    <g transform="translate(1030,730)"><rect width="72" height="30" rx="8" fill="#ffffff" opacity="0.06"/><text x="36" y="21" text-anchor="middle">中文</text></g>
    <g transform="translate(560,80)"><rect width="56" height="30" rx="8" fill="#ffffff" opacity="0.06"/><text x="28" y="21" text-anchor="middle">PT</text></g>
  </g>

  <!-- left panel -->
  <rect x="110" y="230" width="420" height="440" rx="28" fill="url(#panelL)" stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="320" cy="360" r="64" fill="#0ea5e9" opacity="0.14"/>
  <path d="M320 328 a32 32 0 0 1 32 32 v24 a32 32 0 0 1 -64 0 v-24 a32 32 0 0 1 32 -32 z" fill="#e0f2fe"/>
  <rect x="308" y="412" width="24" height="34" rx="6" fill="#e0f2fe"/>
  <rect x="284" y="446" width="72" height="10" rx="5" fill="#e0f2fe"/>

  <!-- left waveform -->
  <g transform="translate(210,510)">
    <rect x="0"  y="26" width="10" height="18" rx="5" fill="url(#waveL)"/>
    <rect x="18" y="12" width="10" height="46" rx="5" fill="url(#waveL)"/>
    <rect x="36" y="0"  width="10" height="70" rx="5" fill="url(#waveL)"/>
    <rect x="54" y="18" width="10" height="34" rx="5" fill="url(#waveL)"/>
    <rect x="72" y="8"  width="10" height="54" rx="5" fill="url(#waveL)"/>
    <rect x="90" y="22" width="10" height="26" rx="5" fill="url(#waveL)"/>
    <rect x="108" y="2" width="10" height="66" rx="5" fill="url(#waveL)"/>
    <rect x="126" y="16" width="10" height="38" rx="5" fill="url(#waveL)"/>
    <rect x="144" y="26" width="10" height="18" rx="5" fill="url(#waveL)"/>
    <rect x="162" y="10" width="10" height="50" rx="5" fill="url(#waveL)"/>
    <rect x="180" y="24" width="10" height="22" rx="5" fill="url(#waveL)"/>
  </g>
  <g transform="translate(255,600)" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7dd3fc">
    <rect x="-40" y="-26" width="80" height="34" rx="10" fill="#0ea5e9" opacity="0.16"/>
    <text x="0" y="-2" text-anchor="middle">EN</text>
  </g>

  <!-- right panel -->
  <rect x="670" y="230" width="420" height="440" rx="28" fill="url(#panelR)" stroke="#14b8a6" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="880" cy="360" r="64" fill="#14b8a6" opacity="0.14"/>
  <path d="M880 328 a32 32 0 0 1 32 32 v24 a32 32 0 0 1 -64 0 v-24 a32 32 0 0 1 32 -32 z" fill="#ecfdf5"/>
  <rect x="868" y="412" width="24" height="34" rx="6" fill="#ecfdf5"/>
  <rect x="844" y="446" width="72" height="10" rx="5" fill="#ecfdf5"/>

  <!-- right waveform -->
  <g transform="translate(770,510)">
    <rect x="0"  y="18" width="10" height="34" rx="5" fill="url(#waveR)"/>
    <rect x="18" y="26" width="10" height="18" rx="5" fill="url(#waveR)"/>
    <rect x="36" y="4"  width="10" height="62" rx="5" fill="url(#waveR)"/>
    <rect x="54" y="20" width="10" height="30" rx="5" fill="url(#waveR)"/>
    <rect x="72" y="0"  width="10" height="70" rx="5" fill="url(#waveR)"/>
    <rect x="90" y="16" width="10" height="38" rx="5" fill="url(#waveR)"/>
    <rect x="108" y="24" width="10" height="22" rx="5" fill="url(#waveR)"/>
    <rect x="126" y="6"  width="10" height="58" rx="5" fill="url(#waveR)"/>
    <rect x="144" y="22" width="10" height="26" rx="5" fill="url(#waveR)"/>
    <rect x="162" y="14" width="10" height="42" rx="5" fill="url(#waveR)"/>
    <rect x="180" y="24" width="10" height="22" rx="5" fill="url(#waveR)"/>
  </g>
  <g transform="translate(815,600)" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5eead4">
    <rect x="-42" y="-26" width="84" height="34" rx="10" fill="#14b8a6" opacity="0.16"/>
    <text x="0" y="-2" text-anchor="middle">DE</text>
  </g>

  <!-- center exchange connector -->
  <circle cx="600" cy="450" r="58" fill="#0a0f1f" stroke="#f0f9ff" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="600" cy="450" r="58" fill="url(#waveL)" opacity="0.12"/>
  <path d="M572 438 h44 l-14 -14 M616 462 h-44 l14 14" stroke="#f0f9ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M530 380 C 560 340, 640 340, 670 380" stroke="#38bdf8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M670 520 C 640 560, 560 560, 530 520" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
